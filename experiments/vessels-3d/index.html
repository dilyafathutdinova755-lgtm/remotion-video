<style>

@font-face { font-family: "Inter"; font-weight: 700; src: url(/public/fonts/Inter-700-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2212, U+2713; }

@font-face { font-family: "Inter"; font-weight: 800; src: url(/public/fonts/Inter-800-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2212, U+2713; }

html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif;
  --text: #121528; --sub: #6a6f8e; --accent: #5653f0; -webkit-font-smoothing: antialiased; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 2; }

.bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
.glow { position: absolute; left: 0; top: 0; border-radius: 50%; }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 62% at 50% 46%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.6) 100%); }

.plaque { position: absolute; z-index: 1; border-radius: 999px; background: rgba(255,255,255,0.94);
  box-shadow: 0 18px 50px rgba(30,40,100,0.20), inset 0 1px 0 #fff; display: flex; align-items: center; overflow: hidden; transform-origin: 60px 50%; }
.plaque-slot { width: 80px; height: 80px; margin-left: 12px; flex: none; }
.plaque-text { margin-left: 22px; font-weight: 800; font-size: 36px; letter-spacing: 0.06em; text-transform: uppercase; color: #10162f; white-space: nowrap; }

.dots { position: absolute; z-index: 3; top: 382px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
.dot { height: 14px; width: 14px; border-radius: 7px; }

.head { position: absolute; z-index: 3; top: 424px; left: 30px; right: 30px; text-align: center; }
.hf { position: relative; }
.hf .hl { position: absolute; left: 0; right: 0; top: 0; white-space: nowrap; }
.hf.eyebrow { height: 50px; }
.hf.eyebrow .hl { font-size: 35px; font-weight: 700; color: var(--accent); letter-spacing: 0.01em; }
.hf.title { height: 100px; }
.hf.title .hl { font-size: 86px; line-height: 100px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
.hf.sub { height: 60px; }
.hf.sub .hl { font-size: 45px; line-height: 60px; font-weight: 500; color: var(--sub); }

.stickers, .flyers { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.flyers { z-index: 7; }
.sticker { position: absolute; left: 0; top: 0; padding: 16px 36px; border-radius: 999px; background: #fff; color: #121528;
  font-weight: 800; font-size: 54px; letter-spacing: -0.01em; white-space: nowrap;
  box-shadow: 0 16px 36px rgba(20,25,70,0.24), inset 0 -3px 0 rgba(20,25,70,0.06); }
.sticker b { font-weight: 600; color: #7a7f9a; }
.sticker.accent { background: linear-gradient(135deg, #6b86ff, #3a46ff); color: #fff; box-shadow: 0 18px 44px rgba(58,70,255,0.5); }
.sticker.accent b { color: #ffe066; font-weight: 800; }
.sticker.violet { background: linear-gradient(135deg, #a77bff, #6c3bff); color: #fff; box-shadow: 0 18px 44px rgba(108,59,255,0.45); }
.sticker.ghosty { background: rgba(255,255,255,0.5); border: 3px dashed rgba(110,100,200,0.65); color: #5b5b8f; box-shadow: none; }
.sticker.result { background: #fff; border: 5px solid var(--accent); font-size: 60px; }
.sticker.big { font-size: 96px; padding: 4px 34px; }
.sticker.answer { font-size: 84px; padding: 22px 52px; background: linear-gradient(135deg, #6b86ff, #3a46ff); color: #fff; box-shadow: 0 22px 54px rgba(58,70,255,0.5); }
.sticker.answer b { color: #ffe066; font-weight: 800; }
.sticker.answer.done { background: linear-gradient(135deg, #3ef0a8, #10b67a); box-shadow: 0 22px 60px rgba(30,220,140,0.55); }
.sticker em { font-style: normal; }

.notes { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.note-wrap { position: absolute; left: 50px; width: 980px; top: 1290px; }
.note { position: relative; background: #fff; border-radius: 40px; padding: 28px 52px 32px; box-shadow: 0 30px 70px rgba(20,25,70,0.26); transform-origin: 50% 100%; }
.note-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.note-top i { width: 16px; height: 16px; border-radius: 50%; background: #ff5f57; display: block; }
.note-top i:nth-child(2) { background: #febc2e; }
.note-top i:nth-child(3) { background: #28c840; }
.note-top span { margin-left: 14px; font-size: 32px; font-weight: 600; color: #8a8fa8; }
.note-line { display: flex; align-items: center; height: 104px; font-size: 76px; font-weight: 700; color: #121528; letter-spacing: -0.01em; }
.caret { width: 6px; height: 76px; background: var(--accent); margin-left: 5px; border-radius: 3px; }
mark { color: inherit; padding: 0 6px; border-radius: 8px;
  background: linear-gradient(90deg, rgba(255,205,60,0.9) calc(var(--hk) * 100%), rgba(255,205,60,0) calc(var(--hk) * 100%));
  background-size: 100% 52%; background-position: 0 92%; background-repeat: no-repeat; }
.floor-shadow { position: absolute; left: 6%; right: 6%; height: 90px; bottom: -78px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(15,15,45,0.55), rgba(15,15,45,0)); }

.eq-wrap { position: absolute; z-index: 4; left: 45px; width: 990px; }
.eq-wrap .floor-shadow { bottom: auto; }
.eq-card { position: relative; background: #fff; border-radius: 46px; box-shadow: 0 36px 90px rgba(20,25,70,0.3); overflow: hidden; transform-origin: 50% 0%; }
.eq-box { position: absolute; inset: 0; }
.eq-tok { position: absolute; left: 50%; top: 0; font-size: 80px; font-weight: 800; color: #121528; white-space: nowrap; letter-spacing: -0.015em; }
.eq-tok.final { font-size: 108px; color: #0c9e66; text-shadow: 0 0 calc(var(--glow, 0) * 34px) rgba(46,229,157,0.85); }

.cond-wrap { position: absolute; z-index: 4; left: 60px; width: 960px; top: 672px; }
.cond-card { position: relative; background: #fff; border-radius: 50px; padding: 50px 56px 54px; box-shadow: 0 36px 90px rgba(20,25,70,0.26);
  font-size: 52px; line-height: 1.34; font-weight: 600; color: var(--text); letter-spacing: -0.01em; transform-origin: 50% 100%; }
.cond-wrap .floor-shadow { bottom: -70px; height: 80px; }
.cw { display: inline-block; }
.cw.a { color: #2f63f0; background: rgba(63,116,255,0.13); border-radius: 14px; padding: 0 12px; font-weight: 800; }
.cw.b { color: #e86f0a; background: rgba(255,138,42,0.16); border-radius: 14px; padding: 0 12px; font-weight: 800; }
.cw.c { color: #6b3fe0; background: rgba(138,91,255,0.15); border-radius: 14px; padding: 0 12px; font-weight: 800; }
.cw.q { color: var(--accent); font-weight: 800; }

.pause-wrap { position: absolute; z-index: 4; left: 60px; width: 960px; height: 250px; }
.pause-wrap .floor-shadow { bottom: -64px; height: 76px; }
.pause-card { width: 960px; height: 250px; box-sizing: border-box; border-radius: 76px; background: linear-gradient(160deg, #ffffff, #eef0ff);
  box-shadow: 0 40px 100px rgba(30,30,100,0.30), inset 0 2px 0 #fff; display: flex; align-items: center; padding: 0 56px 0 52px; gap: 44px; }
.timer { position: relative; width: 190px; height: 190px; flex: none; }
.ring { position: absolute; inset: 0; width: 190px; height: 190px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; }
.ring-bg { stroke: rgba(86,83,240,0.14); }
.ring-fg { stroke: #5653f0; stroke-linecap: round; stroke-dasharray: 540.4; }
.digit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 112px; font-weight: 800; color: #4643e6; letter-spacing: -0.03em; }
.pause-text { display: flex; flex-direction: column; gap: 8px; }
.pt-1 { display: flex; align-items: center; gap: 22px; font-size: 62px; font-weight: 800; color: #121528; white-space: nowrap; letter-spacing: -0.02em; }
.pt-2 { font-size: 40px; font-weight: 500; color: #6a6f8e; white-space: nowrap; }
.bars { display: flex; gap: 9px; }
.bars i { display: block; width: 15px; height: 46px; border-radius: 6px; background: linear-gradient(180deg, #7c79ff, #4643e6); }

.sweep { position: absolute; z-index: 9; pointer-events: none; top: -10%; bottom: -10%; left: 20%; width: 60%; display: none;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.75) 50%, rgba(255,255,255,0)); filter: blur(22px); }

.chip { position: absolute; z-index: 8; left: 540px; white-space: nowrap; border-radius: 999px; font-weight: 800; }
.cta-a { top: 1385px; padding: 26px 58px; font-size: 48px; color: #fff; background: linear-gradient(135deg, #3b7bff, #1652f0); box-shadow: 0 22px 54px rgba(22,82,240,0.45); }
.cta-b { top: 1515px; padding: 20px 46px; font-size: 40px; background: #fff; color: #121528; box-shadow: 0 16px 36px rgba(20,25,70,0.22); }
</style>
