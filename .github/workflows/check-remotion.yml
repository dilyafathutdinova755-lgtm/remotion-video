name: Check Remotion (no publication)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Isolated visual director render
        options: [stills, video]
        default: stills
permissions:
  contents: read
jobs:
  visual-director-test:
    if: github.ref == 'refs/heads/feature/visual-director-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: unzip -o visual-director-test-bundle.zip
      - run: npm ci --prefix experiments/vessels-3d
      - run: pip install numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render isolated Three.js experiment
        env:
          RENDER_MODE: ${{ inputs.mode }}
        run: CHROME=$(which google-chrome) bash scripts/visual-director/run-render.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-director-${{ inputs.mode }}
          path: experiments/vessels-3d/out/
          retention-days: 7
