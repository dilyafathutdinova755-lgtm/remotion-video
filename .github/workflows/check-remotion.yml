name: Check Remotion (no publication)

on:
  push:
    branches:
      - claude/create-video-setup-u21u42
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-remotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить код, регрессии и сборку
        run: bash scripts/qa/check-project.sh

      - name: Контрольные кадры и переход без озвучки и публикации
        run: node scripts/qa/preview.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remotion-check-${{ github.sha }}
          path: out/qa/preview/
          if-no-files-found: ignore
          retention-days: 7
