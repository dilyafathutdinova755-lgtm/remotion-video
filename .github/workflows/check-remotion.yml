name: Check Remotion (no publication)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Restored approved WebGL template
        type: choice
        options: [stills, video]
        default: stills
permissions:
  contents: read
jobs:
  render:
    if: github.ref == 'refs/heads/feature/visual-director-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: ${{ fromJSON(inputs.mode == 'video' && '[0,1,2,3,4,5]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: unzip -o visual-director-test-bundle.zip
      - run: unzip -o traffic-restored-render.zip
      - run: npm ci --prefix experiments/vessels-3d
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify original WebGL and restored layout
        if: matrix.part == 0
        run: |
          TIMES=$(node -e "const t=require('./experiments/traffic-restored/render-timing.json');console.log([0.7,1.8,...t.scenes.map(s=>s.start+Math.min(1.4,(s.end-s.start)/2)),t.pause.timerStart+.1,t.pause.end-.2].join(' '))")
          CHROME=$(which google-chrome) node experiments/traffic-restored/render.mjs stills $TIMES
      - name: Render 120fps silent frames
        if: inputs.mode == 'video'
        env:
          PART: ${{ matrix.part }}
        run: |
          read FROM TO < <(node -e "const t=require('./experiments/traffic-restored/render-timing.json');const n=Math.round(t.duration*120),p=Number(process.env.PART);console.log(Math.floor(n*p/6)/120,Math.floor(n*(p+1)/6)/120)")
          CHROME=$(which google-chrome) node experiments/traffic-restored/render.mjs video --fps 120 --workers 1 --from "$FROM" --to "$TO"
          mv experiments/traffic-restored/out/video-silent.mp4 experiments/traffic-restored/out/part-${PART}.mp4
          rm experiments/traffic-restored/out/seg-*.mp4 experiments/traffic-restored/out/segs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-traffic-part-${{ matrix.part }}
          path: experiments/traffic-restored/out/
          retention-days: 7
