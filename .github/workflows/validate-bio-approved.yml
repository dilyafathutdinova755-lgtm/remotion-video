name: Validate approved biology design (no publication)

on:
  push:
    branches: [codex/bio-approved-validation]
    paths:
      - candidate.patch
      - .github/workflows/validate-bio-approved.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bio-approved-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-regression:
    if: github.ref == 'refs/heads/codex/bio-approved-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: candidate
      - name: Checkout immutable approved design
        uses: actions/checkout@v4
        with:
          ref: 2a03f2954c379e5d9ef0d09ac616d8bcb560f5a8
          persist-credentials: false
          path: approved
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the isolated candidate
        working-directory: approved
        shell: bash
        run: |
          set -euo pipefail
          echo 'd5062be5d0240ec84fd6e772e71219b439de0d399e86a9d1f917586e6f4eef2d  ../candidate/candidate.patch' | sha256sum -c -
          git apply --check ../candidate/candidate.patch
          git apply ../candidate/candidate.patch
          git diff --exit-code
      - name: Install rendering dependencies
        working-directory: approved/experiments/vessels-3d
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python -m pip install numpy==2.2.6
      - name: Check contract and reproduce reference audio
        working-directory: approved
        run: |
          node --test experiments/vessels-3d/bio/dynamic/contract.test.mjs approved-adapter/*.test.mjs experiments/vessels-3d/bio/lessons/contract.test.mjs
          node experiments/vessels-3d/bio/dynamic/prepare-job.mjs --reference
          python experiments/vessels-3d/bio/dynamic/make_mix.py
          python experiments/vessels-3d/bio/dynamic/test_compare_frames.py
      - name: Compare 17 full-resolution frames and mixed audio
        working-directory: approved
        run: node experiments/vessels-3d/bio/dynamic/visual-regression.mjs
      - name: Check chromosome scene layout and spoken answer reveal
        working-directory: approved
        run: node experiments/vessels-3d/bio/lessons/visual-check.mjs
      - name: Render complete isolated chromosome preview at 60 FPS
        working-directory: approved
        env:
          PAGE: experiments/vessels-3d/bio/lessons/index.html
          OUT: experiments/vessels-3d/bio/lessons/out/video
          X264PRESET: fast
        run: |
          node experiments/vessels-3d/bio/dynamic/render-candidate.mjs video --workers 2 --fps 60
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration -of json experiments/vessels-3d/bio/lessons/out/video/video-silent.mp4 > experiments/vessels-3d/bio/lessons/out/video/probe.json
          rm experiments/vessels-3d/bio/lessons/out/video/seg-*.mp4 experiments/vessels-3d/bio/lessons/out/video/segs.txt
      - name: Save inspectable comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-approved-reference-regression
          path: |
            approved/experiments/vessels-3d/bio/dynamic/out/visual-regression/
            approved/experiments/vessels-3d/bio/lessons/out/
          if-no-files-found: warn
          retention-days: 14
