name: Check biology source (no publication)

on:
  push:
    branches:
      - biology-3
    paths:
      - '.github/workflows/check-biology-source.yml'
      - 'scripts/task-source/biology-task-history.mjs'
      - 'scripts/task-source/biology-github-history.mjs'
      - 'scripts/task-source/fetch-newschool-biology-3.mjs'
      - 'data/biology-3-task-history.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: check-biology-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.63.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Проверить синтаксис биологических файлов
        run: |
          node --check scripts/task-source/biology-task-history.mjs
          node --check scripts/task-source/biology-github-history.mjs
          node --check scripts/task-source/fetch-newschool-biology-3.mjs

      - name: Найти новое задание №3 без отправки
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          N8N_NEWSCHOOL_WEBHOOK_URL: ''
        run: |
          node scripts/task-source/fetch-newschool-biology-3.mjs --dry-run

      - name: Убедиться, что тест ничего не изменил
        run: |
          git diff --exit-code -- \
            data/biology-3-task-history.json \
            package.json \
            package-lock.json
