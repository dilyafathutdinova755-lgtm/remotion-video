# Math-only dispatch entrypoint on profile-math-10.
# The production Russian branch is unchanged.
name: Fetch profile math task 10

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ege-profile-math-10-production
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/profile-math-10'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-math-10
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.63.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Check math source files
        run: |
          node --check scripts/task-source/profile-math-task-history.mjs
          node --check scripts/task-source/profile-math-github-history.mjs
          node --check scripts/task-source/fetch-newschool-profile-math-10.mjs

      - name: Find unique task 10 and send to math n8n
        env:
          GITHUB_TOKEN: ${{ github.token }}
          N8N_NEWSCHOOL_WEBHOOK_URL: ${{ secrets.N8N_PROFILE_MATH_WEBHOOK_URL }}
        run: node scripts/task-source/fetch-newschool-profile-math-10.mjs
