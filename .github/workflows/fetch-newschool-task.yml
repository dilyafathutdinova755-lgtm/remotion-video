# Chemistry-only dispatch entrypoint on chemistry-11.
# The production Russian branch is unchanged.
name: Fetch chemistry task 3

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ege-chemistry-11-production
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/chemistry-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chemistry-11
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.63.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Check chemistry source files
        run: |
          node --check scripts/task-source/chemistry-task-history.mjs
          node --check scripts/task-source/chemistry-github-history.mjs
          node --check scripts/task-source/fetch-newschool-chemistry-11.mjs

      - name: Find unique task 3 and send to chemistry n8n
        env:
          GITHUB_TOKEN: ${{ github.token }}
          N8N_NEWSCHOOL_WEBHOOK_URL: ${{ secrets.N8N_CHEMISTRY_WEBHOOK_URL }}
        run: node scripts/task-source/fetch-newschool-chemistry-11.mjs
