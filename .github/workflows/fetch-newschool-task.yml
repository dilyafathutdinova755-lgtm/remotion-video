name: Fetch New School task

# Production-источник заданий для n8n.
# Перед отправкой нового задания сначала проверяем Remotion.
# Если код/тесты/сборка сломаны, webhook в n8n НЕ вызывается.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить проект ДО отправки задания в n8n
        run: bash scripts/qa/check-project.sh

      - name: Установить Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Тесты извлечения/валидации заданий
        run: node scripts/task-source/test-newschool-lib.mjs

      - name: Собрать и отправить задание в n8n
        env:
          N8N_NEWSCHOOL_WEBHOOK_URL: ${{ secrets.N8N_NEWSCHOOL_WEBHOOK_URL }}
        run: |
          node scripts/task-source/fetch-newschool-task.mjs
