name: Render on demand

# Рендер одного ролика по запросу n8n: n8n сам дёргает
# POST /repos/{owner}/{repo}/actions/workflows/render-on-demand.yml/dispatches
# с этими тремя полями, когда озвучка для очередной задачи готова.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Идентификатор задачи (строка/id строки в таблице n8n)"
        required: true
        type: string
      task_data:
        description: >
          JSON строкой: {exam, subject, task_number, condition_text, answer,
          voiceover_text, account}
        required: true
        type: string
      audio_url:
        description: "Прямая или веб-ссылка на mp3 в Google Drive"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          npm ci
          # Версия зафиксирована: --fuzzy появился в gdown 4.4, но раннер может
          # найти в PATH другой, более старый gdown раньше pip-версии — поэтому
          # ниже вызываем через "python3 -m gdown" тем же интерпретатором.
          pip install --quiet "gdown==5.2.0"

      - name: Сохранить task_data во временный файл
        env:
          TASK_DATA: ${{ inputs.task_data }}
        run: printf '%s' "$TASK_DATA" > task_data.json

      - name: Проверить task_data и вычислить безопасный id файла
        id: prep
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('task_data.json', 'utf8'));
            for (const f of ['exam','subject','task_number','condition_text','answer','voiceover_text']) {
              if (!d[f] && d[f] !== 0) { console.error('В task_data нет поля ' + f); process.exit(1); }
            }
          "
          SAFE_ID=$(printf '%s' "$TASK_ID" | tr -c 'a-zA-Z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g')
          if [ -z "$SAFE_ID" ]; then SAFE_ID="task"; fi
          echo "safe_id=$SAFE_ID" >> "$GITHUB_OUTPUT"

      - name: Скачать озвучку с Google Drive
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: python3 -m gdown --fuzzy "$AUDIO_URL" -O audio_raw.mp3

      - name: Разметить тайминг по озвучке (align.py)
        run: |
          # ElevenLabs здесь не вызывается — аудио уже готово и лежит на Drive.
          # --text для align.py обязан совпадать с тем, что реально
          # произнесено (словами, не цифрами), иначе подсчёт слов для
          # тайминга разъедется. print-normalized-voiceover.mjs сам решает,
          # откуда его взять: если n8n прислал task_data.voiceover_tts_text
          # (тот самый текст, что реально ушёл в ElevenLabs — сгенерирован
          # той же normalize-for-voiceover.mjs через generated/n8n-normalize-
          # for-elevenlabs.js) — используем его один в один, БЕЗ повторной
          # нормализации; иначе считаем сами по voiceover_text + subject
          # (см. PLAYBOOK.md §11c, «одна логика для n8n и GitHub»).
          # --display-text — исходный текст с цифрами, из него берётся
          # показанный на экране check (там число должно остаться цифрой).
          # --condition-text — task_data.condition_text дословно: align.py
          # ищет его внутри озвучки, чтобы отличить условие (не показывается
          # как check) от объяснения (звучит следом, до "Ответ:"/CTA — см.
          # PLAYBOOK.md §11b, фиксированный порядок сегментов).
          # --subject — task_data.subject как есть: для гуманитарных
          # (русский/литература/история/обществознание) align.py допускает
          # отсутствие отдельной озвученной фразы "Ответ: ..." и сам
          # вычисляет answerSec как конец объяснения (см. PLAYBOOK.md §11d);
          # для остальных предметов поведение не меняется — "Ответ:" по
          # прежнему обязателен.
          TASK_TEXT=$(node scripts/dynamic-task/print-normalized-voiceover.mjs task_data.json)
          RAW_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('task_data.json','utf8')).voiceover_text)")
          CONDITION_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('task_data.json','utf8')).condition_text)")
          SUBJECT_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('task_data.json','utf8')).subject)")
          python3 scripts/dynamic-task/align.py \
            --text "$TASK_TEXT" \
            --display-text "$RAW_TEXT" \
            --condition-text "$CONDITION_TEXT" \
            --subject "$SUBJECT_TEXT" \
            --audio audio_raw.mp3 \
            --ffmpeg node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg \
            > align.json
          cat align.json

      - name: Положить аудио в public/ и собрать TaskDef
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          mkdir -p public/audio
          AUDIO_REL="audio/dynamic-${{ steps.prep.outputs.safe_id }}.mp3"
          cp audio_raw.mp3 "public/$AUDIO_REL"
          node scripts/dynamic-task/build-dynamic-task.mjs \
            --task-id "$TASK_ID" \
            --task-data task_data.json \
            --align align.json \
            --audio-src "$AUDIO_REL" \
            --out src/ege/tasks/_dynamic.generated.tsx \
            --id-out composition_id.txt
          cat src/ege/tasks/_dynamic.generated.tsx

      - name: Рендер видео
        id: render
        run: |
          COMPOSITION_ID=$(cat composition_id.txt)
          echo "composition_id=$COMPOSITION_ID" >> "$GITHUB_OUTPUT"
          npx remotion render "$COMPOSITION_ID" out/dynamic.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.prep.outputs.safe_id }}
          path: out/dynamic.mp4
          retention-days: 30

      - name: Проверить наличие секретов для Google Drive
        id: drive_check
        env:
          HAS_SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
          HAS_FOLDER: ${{ secrets.GDRIVE_FOLDER_ID != '' }}
        run: |
          if [ "$HAS_SA" = "true" ] && [ "$HAS_FOLDER" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GDRIVE_SERVICE_ACCOUNT_JSON и/или GDRIVE_FOLDER_ID не заданы в секретах репозитория — видео на Google Drive не загружено, video_url в вебхуке будет ссылкой на артефакт GitHub Actions."
          fi

      - name: Загрузить видео на Google Drive
        id: drive_upload
        if: steps.drive_check.outputs.enabled == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          RESULT=$(node scripts/dynamic-task/gdrive-upload.mjs \
            --file out/dynamic.mp4 \
            --name "${{ steps.render.outputs.composition_id }}.mp4")
          echo "$RESULT"
          echo "link=$(node -e "console.log(JSON.parse(process.argv[1]).webViewLink)" "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Сообщить n8n, что видео готово
        env:
          TASK_ID: ${{ inputs.task_id }}
          VIDEO_URL: ${{ steps.drive_upload.outputs.link }}
          N8N_VIDEO_READY_WEBHOOK_URL: ${{ secrets.N8N_VIDEO_READY_WEBHOOK_URL }}
        run: |
          # Единственный callback о готовом видео за весь рендер — дальше он
          # запускает публикацию в Postmypost, и второй вызов создал бы
          # дубликат Reel. video_url обязан быть ссылкой именно на сам MP4
          # (Google Drive), а не на страницу прогона GitHub Actions — без
          # неё это не видеофайл, поэтому фолбэка на actions/runs/... нет:
          # если drive_upload не отработал (секреты Google Drive не заданы
          # или сама загрузка упала), callback не отправляется вовсе, а шаг
          # падает с понятной ошибкой.
          if [ -z "$VIDEO_URL" ]; then
            echo "::error::steps.drive_upload.outputs.link пуст — видео не загружено на Google Drive, реального video_url нет. Callback video-ready НЕ отправлен (не отправлять GitHub Actions URL вместо ссылки на MP4)."
            exit 1
          fi

          # account — из того же task_data.json, что уже сохранён шагом
          # "Сохранить task_data во временный файл" выше; безопасно (пустая
          # строка), если поля нет вовсе.
          ACCOUNT=$(node -e "
            const d = JSON.parse(require('fs').readFileSync('task_data.json', 'utf8'));
            console.log(d.account || '');
          ")
          BODY=$(TASK_ID="$TASK_ID" VIDEO_URL="$VIDEO_URL" ACCOUNT="$ACCOUNT" node -e "
            console.log(JSON.stringify({
              task_id: process.env.TASK_ID,
              video_url: process.env.VIDEO_URL,
              account: process.env.ACCOUNT,
              video_status: 'ready',
            }));
          ")
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$N8N_VIDEO_READY_WEBHOOK_URL"
