name: Render on demand

# Рендер одного ролика по запросу n8n: n8n сам дёргает
# POST /repos/{owner}/{repo}/actions/workflows/render-on-demand.yml/dispatches
# с этими тремя полями, когда озвучка для очередной задачи готова.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Идентификатор задачи (строка/id строки в таблице n8n)"
        required: true
        type: string
      task_data:
        description: >
          JSON строкой: {exam, subject, task_number, condition_text, answer,
          voiceover_text, account}
        required: true
        type: string
      audio_url:
        description: "Прямая или веб-ссылка на mp3 в Google Drive"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          npm ci
          # Версия зафиксирована: --fuzzy появился в gdown 4.4, но раннер может
          # найти в PATH другой, более старый gdown раньше pip-версии — поэтому
          # ниже вызываем через "python3 -m gdown" тем же интерпретатором.
          pip install --quiet "gdown==5.2.0"

      - name: Сохранить task_data во временный файл
        env:
          TASK_DATA: ${{ inputs.task_data }}
        run: printf '%s' "$TASK_DATA" > task_data.json

      - name: Проверить task_data и вычислить безопасный id файла
        id: prep
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('task_data.json', 'utf8'));
            for (const f of ['exam','subject','task_number','condition_text','answer','voiceover_text']) {
              if (!d[f] && d[f] !== 0) { console.error('В task_data нет поля ' + f); process.exit(1); }
            }
          "
          SAFE_ID=$(printf '%s' "$TASK_ID" | tr -c 'a-zA-Z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g')
          if [ -z "$SAFE_ID" ]; then SAFE_ID="task"; fi
          echo "safe_id=$SAFE_ID" >> "$GITHUB_OUTPUT"

      - name: Скачать озвучку с Google Drive
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: python3 -m gdown --fuzzy "$AUDIO_URL" -O audio_raw.mp3

      - name: Разметить тайминг по озвучке (align.py)
        run: |
          # ElevenLabs здесь не вызывается — аудио уже готово и лежит на Drive.
          # --text для align.py обязан совпадать с тем, что реально
          # произнесено (словами, не цифрами), иначе подсчёт слов для
          # тайминга разъедется. print-normalized-voiceover.mjs сам решает,
          # откуда его взять: если n8n прислал task_data.voiceover_tts_text
          # (тот самый текст, что реально ушёл в ElevenLabs — сгенерирован
          # той же normalize-for-voiceover.mjs через generated/n8n-normalize-
          # for-elevenlabs.js) — используем его один в один, БЕЗ повторной
          # нормализации; иначе считаем сами по voiceover_text + subject
          # (см. PLAYBOOK.md §11c, «одна логика для n8n и GitHub»).
          # --display-text — исходный текст с цифрами, из него берётся
          # показанный на экране check (там число должно остаться цифрой).
          # --condition-text — task_data.condition_text дословно: align.py
          # ищет его внутри озвучки, чтобы отличить условие (не показывается
          # как check) от объяснения (звучит следом, до "Ответ:"/CTA — см.
          # PLAYBOOK.md §11b, фиксированный порядок сегментов).
          # --subject — task_data.subject как есть: для гуманитарных
          # (русский/литература/история/обществознание) align.py допускает
          # отсутствие отдельной озвученной фразы "Ответ: ..." и сам
          # вычисляет answerSec как конец объяснения (см. PLAYBOOK.md §11d);
          # для остальных предметов поведение не меняется — "Ответ:" по
          # прежнему обязателен.
          TASK_TEXT=$(node scripts/dynamic-task/print-normalized-voiceover.mjs task_data.json)
          RAW_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('task_data.json','utf8')).voiceover_text)")
          CONDITION_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('task_data.json','utf8')).condition_text)")
          SUBJECT_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('task_data.json','utf8')).subject)")
          python3 scripts/dynamic-task/align.py \
            --text "$TASK_TEXT" \
            --display-text "$RAW_TEXT" \
            --condition-text "$CONDITION_TEXT" \
            --subject "$SUBJECT_TEXT" \
            --audio audio_raw.mp3 \
            --ffmpeg node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg \
            > align.json
          cat align.json

      - name: Положить аудио в public/ и собрать TaskDef
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          mkdir -p public/audio
          AUDIO_REL="audio/dynamic-${{ steps.prep.outputs.safe_id }}.mp3"
          cp audio_raw.mp3 "public/$AUDIO_REL"
          node scripts/dynamic-task/build-dynamic-task.mjs \
            --task-id "$TASK_ID" \
            --task-data task_data.json \
            --align align.json \
            --audio-src "$AUDIO_REL" \
            --out src/ege/tasks/_dynamic.generated.tsx \
            --id-out composition_id.txt
          cat src/ege/tasks/_dynamic.generated.tsx

      - name: Рендер видео
        id: render
        run: |
          COMPOSITION_ID=$(cat composition_id.txt)
          echo "composition_id=$COMPOSITION_ID" >> "$GITHUB_OUTPUT"
          npx remotion render "$COMPOSITION_ID" out/dynamic.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.prep.outputs.safe_id }}
          path: out/dynamic.mp4
          retention-days: 30

      - name: Проверить наличие секретов для Google Drive
        id: drive_check
        env:
          HAS_SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
          HAS_FOLDER: ${{ secrets.GDRIVE_FOLDER_ID != '' }}
        run: |
          if [ "$HAS_SA" = "true" ] && [ "$HAS_FOLDER" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GDRIVE_SERVICE_ACCOUNT_JSON и/или GDRIVE_FOLDER_ID не заданы в секретах репозитория — видео на Google Drive не загружено, video_url в вебхуке будет ссылкой на артефакт GitHub Actions."
          fi

      - name: Загрузить видео на Google Drive
        id: drive_upload
        if: steps.drive_check.outputs.enabled == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          RESULT=$(node scripts/dynamic-task/gdrive-upload.mjs \
            --file out/dynamic.mp4 \
            --name "${{ steps.render.outputs.composition_id }}.mp4")
          echo "$RESULT"
          echo "link=$(node -e "console.log(JSON.parse(process.argv[1]).webViewLink)" "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Загрузить MP4 в Postmypost (upload/init)
        id: postmypost_init
        env:
          POSTMYPOST_API_KEY: ${{ secrets.POSTMYPOST_API_KEY }}
        run: |
          # Тот же файл, что уже создаёт "Рендер видео" и (опционально)
          # грузит шаг Google Drive выше — путь не выдумываем, берём как есть.
          MP4_PATH="out/dynamic.mp4"
          if [ ! -f "$MP4_PATH" ]; then
            echo "::error::$MP4_PATH не найден после шага рендера — грузить в Postmypost нечего."
            exit 1
          fi
          FILE_NAME=$(basename "$MP4_PATH")
          FILE_SIZE=$(stat -c%s "$MP4_PATH")
          echo "Postmypost upload/init: name=$FILE_NAME, size=$FILE_SIZE bytes"

          BODY=$(FILE_NAME="$FILE_NAME" FILE_SIZE="$FILE_SIZE" node -e "
            console.log(JSON.stringify({
              project_id: 351182,
              name: process.env.FILE_NAME,
              size: Number(process.env.FILE_SIZE),
            }));
          ")

          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $POSTMYPOST_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.postmypost.io/v4.1/upload/init" > postmypost_init_response.json

          # Разбираем ответ строго как он есть — id/action/fields не
          # придумываются, а проверяются на присутствие; fields целиком (все
          # key/value) сохраняются рядом для следующего шага. В лог не
          # попадают значения fields (это одноразовые presigned-поля upload'а,
          # но осторожность не помешает) — только id и имена ключей.
          node -e "
            const r = JSON.parse(require('fs').readFileSync('postmypost_init_response.json', 'utf8'));
            if (r.id === undefined || r.id === null || !r.action || !Array.isArray(r.fields)) {
              console.error('ОШИБКА: ответ Postmypost upload/init не содержит id/action/fields.');
              process.exit(1);
            }
            const fs = require('fs');
            fs.writeFileSync('postmypost_upload_id.json', JSON.stringify(r.id));
            fs.writeFileSync('postmypost_upload_id.txt', String(r.id));
            fs.writeFileSync('postmypost_action_url.txt', r.action);
            fs.writeFileSync('postmypost_fields.json', JSON.stringify(r.fields));
            console.error('Postmypost upload_id=' + JSON.stringify(r.id) + ', полей в fields: ' + r.fields.length + ' (' + r.fields.map(f => f.key).join(', ') + ')');
          "

      - name: Отправить MP4 в Postmypost (multipart upload)
        run: |
          ACTION_URL=$(cat postmypost_action_url.txt)
          MP4_PATH="out/dynamic.mp4"

          # Все key/value из fields ответа upload/init как есть, ничего не
          # хардкодим. --form-string — чтобы значение поля никогда не было
          # интерпретировано curl как "@файл"/"<файл" (некоторые presigned
          # значения начинаются с похожих символов). Разделитель между
          # аргументами — NUL, чтобы точно пережить любые символы в values;
          # завершающий NUL после последнего элемента обязателен — без него
          # "read -r -d ''" не считает последнюю запись (EOF без разделителя
          # молча обрывает цикл до её обработки) и теряется последнее поле.
          # Сам MP4 передаётся последним полем — обычное требование
          # presigned POST-загрузок (S3-подобный протокол).
          node -e "
            const fields = JSON.parse(require('fs').readFileSync('postmypost_fields.json', 'utf8'));
            const out = [];
            for (const f of fields) { out.push('--form-string'); out.push(f.key + '=' + f.value); }
            process.stdout.write(out.join('\u0000') + '\u0000');
          " > postmypost_form_args.bin

          FORM_ARGS=()
          while IFS= read -r -d '' arg; do FORM_ARGS+=("$arg"); done < postmypost_form_args.bin

          curl -sS --fail-with-body -X POST \
            "${FORM_ARGS[@]}" \
            -F "file=@${MP4_PATH}" \
            "$ACTION_URL"

      - name: Завершить upload в Postmypost (upload/complete)
        env:
          POSTMYPOST_API_KEY: ${{ secrets.POSTMYPOST_API_KEY }}
        run: |
          UPLOAD_ID=$(cat postmypost_upload_id.txt)
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $POSTMYPOST_API_KEY" \
            "https://api.postmypost.io/v4.1/upload/complete?id=${UPLOAD_ID}"

      - name: Сообщить n8n, что видео готово
        env:
          TASK_ID: ${{ inputs.task_id }}
          N8N_VIDEO_READY_WEBHOOK_URL: ${{ secrets.N8N_VIDEO_READY_WEBHOOK_URL }}
        run: |
          # Единственный callback о готовом видео за весь рендер — дальше
          # он инициирует публикацию из уже загруженного и завершённого
          # Postmypost-upload'а (проект 351182); второй вызов создал бы
          # дубликат Reel. Не зависит от Google Drive вовсе (см. шаги
          # Postmypost выше) — отсутствие Drive-ссылки никак не мешает.
          ACCOUNT=$(node -e "
            const d = JSON.parse(require('fs').readFileSync('task_data.json', 'utf8'));
            console.log(d.account || '');
          ")
          BODY=$(TASK_ID="$TASK_ID" ACCOUNT="$ACCOUNT" node -e "
            const uploadId = JSON.parse(require('fs').readFileSync('postmypost_upload_id.json', 'utf8'));
            console.log(JSON.stringify({
              task_id: process.env.TASK_ID,
              postmypost_upload_id: uploadId,
              account: process.env.ACCOUNT,
              video_status: 'ready',
            }));
          ")

          # Callback обязан быть надёжным: ретраи на сетевые/5xx ошибки, и
          # если n8n так и не ответил 2xx — весь workflow должен упасть, а
          # не остаться зелёным при недоставленном сообщении.
          curl -sS --fail-with-body \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$N8N_VIDEO_READY_WEBHOOK_URL"
