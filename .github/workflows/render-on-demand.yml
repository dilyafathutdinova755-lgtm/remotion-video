name: Render biology Three.js v2 (test, no publication)
on:
  push:
    branches: [codex/bio-three-v2]
    paths: [bio-three-v2.patch, .github/workflows/render-on-demand.yml]
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      task_data:
        required: true
        type: string
      audio_url:
        required: true
        type: string
      run_mode:
        required: true
        default: test
        type: choice
        options: [test]
permissions:
  contents: read
concurrency:
  group: bio-three-v2-${{ github.event.inputs.task_id || github.sha }}
  cancel-in-progress: false
jobs:
  validate-and-render:
    if: github.ref == 'refs/heads/codex/bio-three-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: c5254c11c5a4f7d18c03c9e0b32fd7393fd9e9f8
          persist-credentials: false
          path: source
      - name: Install isolated renderer source
        working-directory: source
        run: git apply --check ../candidate/bio-three-v2.patch && git apply ../candidate/bio-three-v2.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        working-directory: source/biology-three-v2
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python -m pip install gdown==5.2.0
      - name: Audio speed contract test
        working-directory: source/biology-three-v2
        run: node --test prepare.test.mjs
      - name: Read and validate n8n job
        if: github.event_name == 'workflow_dispatch'
        working-directory: source
        env:
          TASK_DATA: ${{ inputs.task_data }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_MODE: ${{ inputs.run_mode }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {validateStoryboard} from './biology-three-v2/contract.mjs';
          if(Buffer.byteLength(process.env.TASK_DATA)>60000)throw Error('Job too large');
          const job=validateStoryboard(JSON.parse(process.env.TASK_DATA));
          const url=new URL(process.env.AUDIO_URL);
          if(url.protocol!=='https:'||url.hostname!=='drive.google.com'||url.username||url.password)throw Error('Drive audio URL required');
          if(job.id!==process.env.TASK_ID||process.env.RUN_MODE!=='test'||job.run_mode!=='test'||job.publication_allowed!==false)throw Error('Test identity');
          fs.writeFileSync('biology-three-v2/input.json',JSON.stringify(job));
          JS
          python -m gdown --fuzzy "$AUDIO_URL" -O biology-three-v2/input.mp3
          node biology-three-v2/prepare.mjs biology-three-v2/input.json biology-three-v2/input.mp3
      - name: Verify layout, object-first opening, hidden unknown and scene timings
        working-directory: source
        run: node biology-three-v2/visual-check.mjs
      - name: Render actual n8n job at native 60 FPS
        if: github.event_name == 'workflow_dispatch'
        working-directory: source
        run: |
          node biology-three-v2/render.mjs video --workers 3 --fps 60
          node biology-three-v2/finalize.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biology-three-v2-${{ github.run_id }}
          path: |
            source/biology-three-v2/out/qa/
            source/biology-three-v2/out/video.mp4
            source/biology-three-v2/out/prepared-job.json
            source/biology-three-v2/out/probe.json
            source/biology-three-v2/out/result.json
          if-no-files-found: warn
          retention-days: 14
